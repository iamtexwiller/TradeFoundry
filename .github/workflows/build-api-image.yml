name: Build and Push API Image

# Builda e publica a imagem da API no GitHub Container Registry (ghcr.io)
# a cada push que altere algo dentro de app/. Usa o mesmo registro do
# código-fonte (GitHub), evitando depender de uma conta separada (Docker Hub)
# e seus limites de pull rate mais restritivos para contas anônimas.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-api-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/tradefoundry-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Necessário para builds multi-arquitetura: o runner do GitHub Actions
      # é amd64, e o QEMU permite emular a arquitetura arm64 durante o build.
      # Sem este passo, o Buildx silenciosamente pula a plataforma arm64 e
      # publica só um manifesto de proveniência (sem imagem real) para ela.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          # Build multi-arquitetura: GitHub Actions roda em amd64 (x86_64),
          # mas o Minikube deste projeto roda em arm64 (Apple Silicon) — sem
          # declarar as duas plataformas, o pull falha no cluster com
          # "no matching manifest for linux/arm64/v8".
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
